# KoduDB Helm chart. Environment overlays: values-dev.yaml, values-staging.yaml, values-prod.yaml.
#   helm install kodudb ./deploy/helm/kodudb -f deploy/helm/kodudb/values-prod.yaml

image:
  registry: docker.io/kns777
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# Public addresses. Leave empty to derive them from ingress hosts (https) or to use port-forwarding.
publicUrls:
  api: ""            # e.g. https://api.example.com (used in email and sign-in links)
  s3: ""             # e.g. https://s3.example.com (shown in Files -> S3 access)
  storageConsole: "" # e.g. https://storage.example.com/rustfs/console/

# Secrets. Empty values are generated on first install and kept on upgrade.
# To manage them yourself, create a Secret with the same keys and set existingSecret.
existingSecret: ""
secrets:
  postgresPassword: ""
  s3AccessKey: ""
  s3SecretKey: ""
  jwtSecret: ""      # optional; the API generates and stores one when empty
  encryptionKey: ""  # optional; the API generates and stores one when empty
  dashboardUsername: admin
  dashboardPassword: ""  # optional; generated by the API and printed once in its log when empty

api:
  replicas: 1
  port: 8787
  trustProxy: true   # behind an ingress controller, use the client address from X-Forwarded-For
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  # Local file storage, used only when storage.enabled is false and externalS3 is not set.
  filesPersistence:
    size: 5Gi
    storageClass: ""
  extraEnv: []

console:
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# Bundled Postgres. Disable it and set externalDatabase.url for a managed database (RDS, Cloud SQL, Azure Database...).
postgres:
  enabled: true
  image: docker.io/library/postgres:17-alpine
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

externalDatabase:
  # postgres://user:password@host:5432/kodudb. The user must be able to create databases and roles for extra projects.
  url: ""
  existingSecretKey: ""  # read the URL from key DATABASE_URL of existingSecret instead

# Bundled S3-compatible storage (RustFS). Disable it for external S3 (set externalS3) or local files.
storage:
  enabled: true
  image: docker.io/rustfs/rustfs:1.0.4
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

externalS3:
  endpoint: ""       # e.g. https://s3.eu-central-1.amazonaws.com; per-project keys need a RustFS admin API
  region: us-east-1

ingress:
  enabled: false
  className: ""      # e.g. nginx, traefik
  annotations: {}    # e.g. cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    console: ""      # app.example.com
    api: ""          # api.example.com
    s3: ""           # s3.example.com (bundled storage only)
    storageConsole: ""  # storage.example.com (bundled storage only)
  tls: []            # - secretName: kodudb-tls
                     #   hosts: [app.example.com, api.example.com, s3.example.com, storage.example.com]

podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
