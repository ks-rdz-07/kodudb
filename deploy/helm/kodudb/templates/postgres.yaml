{{- if .Values.postgres.enabled }}
{{- $name := include "kodudb.fullname" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-postgres
  labels: {{- include "kodudb.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $name }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "kodudb.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kodudb.selector" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: kodudb }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "kodudb.secretName" . }}, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres, -d, kodudb] }
            periodSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.postgres.persistence.size }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-postgres
  labels: {{- include "kodudb.labels" . | nindent 4 }}
spec:
  selector: {{- include "kodudb.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
{{- end }}
