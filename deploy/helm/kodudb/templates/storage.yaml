{{- if .Values.storage.enabled }}
{{- $name := include "kodudb.fullname" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-storage
  labels: {{- include "kodudb.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  serviceName: {{ $name }}-storage
  replicas: 1
  selector:
    matchLabels: {{- include "kodudb.selector" (dict "root" . "component" "storage") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kodudb.selector" (dict "root" . "component" "storage") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 10001  # the RustFS image runs as a non-root user; let it write the volume
      containers:
        - name: rustfs
          image: {{ .Values.storage.image }}
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          env:
            - { name: RUSTFS_CONSOLE_ENABLE, value: "true" }
            - name: RUSTFS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "kodudb.secretName" . }}, key: S3_ACCESS_KEY } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "kodudb.secretName" . }}, key: S3_SECRET_KEY } }
          readinessProbe:
            httpGet: { path: /health, port: s3 }
            periodSeconds: 5
          resources: {{- toYaml .Values.storage.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storage.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.storage.persistence.size }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-storage
  labels: {{- include "kodudb.labels" . | nindent 4 }}
spec:
  selector: {{- include "kodudb.selector" (dict "root" . "component" "storage") | nindent 4 }}
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
    - { name: console, port: 9001, targetPort: console }
{{- end }}
