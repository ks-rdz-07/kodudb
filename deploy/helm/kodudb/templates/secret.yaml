{{- if not .Values.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kodudb.secretName" . }}
  labels: {{- include "kodudb.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep  # deleting the release must not lose the keys that decrypt stored data
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ include "kodudb.secretValue" (dict "root" . "key" "POSTGRES_PASSWORD" "value" $s.postgresPassword "length" 32) | quote }}
  S3_ACCESS_KEY: {{ include "kodudb.secretValue" (dict "root" . "key" "S3_ACCESS_KEY" "value" $s.s3AccessKey "length" 20) | quote }}
  S3_SECRET_KEY: {{ include "kodudb.secretValue" (dict "root" . "key" "S3_SECRET_KEY" "value" $s.s3SecretKey "length" 40) | quote }}
  JWT_SECRET: {{ include "kodudb.secretValue" (dict "root" . "key" "JWT_SECRET" "value" $s.jwtSecret) | quote }}
  ENCRYPTION_KEY: {{ include "kodudb.secretValue" (dict "root" . "key" "ENCRYPTION_KEY" "value" $s.encryptionKey) | quote }}
  DASHBOARD_USERNAME: {{ $s.dashboardUsername | default "admin" | quote }}
  DASHBOARD_PASSWORD: {{ include "kodudb.secretValue" (dict "root" . "key" "DASHBOARD_PASSWORD" "value" $s.dashboardPassword) | quote }}
  {{- if .Values.externalDatabase.url }}
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
{{- end }}
