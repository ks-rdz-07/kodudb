# Render Blueprint: KoduDB API and console from published images, Render Postgres, and a disk for files.
# New -> Blueprint -> pick this repository. After the first deploy, set KODUDB_PUBLIC_URL on kodudb-api to its
# public URL (https://kodudb-api-xxxx.onrender.com) and read the console sign-in in the kodudb-api logs.
# Files are kept on the API's disk; for S3 storage set S3_ENDPOINT, S3_ACCESS_KEY and S3_SECRET_KEY instead.
databases:
  - name: kodudb-db
    databaseName: kodudb
    plan: basic-256mb

services:
  - type: web
    name: kodudb-api
    runtime: image
    image:
      url: docker.io/kns777/kodudb-api:0.3.2
    plan: starter
    healthCheckPath: /health
    disk:
      name: files
      mountPath: /data/storage
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kodudb-db
          property: connectionString
      - key: PORT
        value: "8787"
      - key: TRUST_PROXY
        value: "1"
      - key: STORAGE_ROOT
        value: /data/storage
      - key: KODUDB_PUBLIC_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false

  - type: web
    name: kodudb-console
    runtime: image
    image:
      url: docker.io/kns777/kodudb-console:0.3.2
    plan: starter
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: "3000"
      - key: KODUDB_API_URL
        fromService:
          type: web
          name: kodudb-api
          property: hostport
      - key: KODUDB_PUBLIC_URL
        sync: false
