version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/console"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/marketing"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directories: ["/api", "/console"]
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
