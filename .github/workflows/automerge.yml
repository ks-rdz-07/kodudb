# Auto-merge, gated by branch protection: GitHub only merges once every required check passes
# and the required review is in. Nothing here checks out or runs pull request code.
name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Safe use of pull_request_target: the job below never checks out or runs PR code; it only calls
  # `gh pr merge --auto` on a label that only maintainers can add.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [labeled]

permissions:
  contents: read

jobs:
  dependabot:
    name: Dependabot patch/minor
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Approve and enable auto-merge
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-major' }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  label:
    name: Maintainer label "automerge"
    # Only people with triage/write access can add labels, so this is a maintainer decision.
    if: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'automerge' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
