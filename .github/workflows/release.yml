# After every merge to main: when the version in api/Cargo.toml is new, build the API and console
# container images, push them to GitHub Packages (ghcr.io) and Docker Hub, and publish a GitHub Release.
# Docker Hub needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Read & Write access
# token); without them only ghcr.io is used. Run manually with "republish" to push the current version again.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "marketing/**", "**/*.md", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:
    inputs:
      republish:
        description: Build and push images for the current version even if it is already released
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: kns777

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ver
        name: Is this a new version?
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' api/Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already released."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        if: steps.ver.outputs.new == 'true' || inputs.republish
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "::notice::DOCKERHUB_TOKEN is not set; pushing to ghcr.io only."
          fi
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for part in api console; do
            IMAGES="ghcr.io/$OWNER/kodudb-$part"
            [ -n "$DOCKERHUB_TOKEN" ] && IMAGES="$IMAGES docker.io/$DOCKERHUB_NAMESPACE/kodudb-$part"
            TAGS=""
            for img in $IMAGES; do TAGS="$TAGS -t $img:$VERSION -t $img:latest"; done
            docker build $TAGS --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" "./$part"
            for img in $IMAGES; do
              docker push "$img:$VERSION"
              docker push "$img:latest"
            done
          done
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish GitHub Release
        if: steps.ver.outputs.new == 'true'
        run: >
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "KoduDB $VERSION" --generate-notes --prerelease
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
