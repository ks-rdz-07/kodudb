name: Bug report
description: Report a problem with KoduDB
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security problems do not belong here. See SECURITY.md. Remove keys, passwords, tokens and real user data before posting."
  - type: input
    id: version
    attributes:
      label: KoduDB version
      description: The version in api/Cargo.toml, or the image tag.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How do you run it?
      options:
        - Docker Compose
        - Podman Compose
        - Railpack / Nixpacks / buildpacks
        - PM2
        - Windows Server
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - REST API
        - Identity / sign-in providers / two-factor
        - Email
        - Files
        - Live events
        - Projects / branching / migrations
        - Data sources
        - Console
        - Deployment
        - Other
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: output
    attributes:
      label: Relevant logs or screenshots
      description: Remove keys, passwords, tokens and real user data.
