[package]
name = "kodudb-api"
version = "0.1.1"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "json", "macros"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
mongodb = "3"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7", features = ["cors"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
hmac = "0.13"
sha1 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
