name: kodudb

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run node scripts/gen-env.mjs first}
      POSTGRES_DB: kodudb
    volumes:
      - kodudb-db:/var/lib/postgresql/data
      - ./api/sql/project.sql:/docker-entrypoint-initdb.d/00-project.sql:ro
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "kodudb"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/kodudb
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      KODUDB_PUBLIC_URL: ${KODUDB_PUBLIC_URL:-http://localhost:8787}
      # Files go to the bundled S3 storage. Earlier local files in /data/storage are copied over once and kept.
      STORAGE_ROOT: /data/storage
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run node scripts/gen-env.mjs first}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run node scripts/gen-env.mjs first}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_CONSOLE_URL: ${S3_CONSOLE_URL:-http://localhost:9001/rustfs/console/}
    volumes:
      - kodudb-storage:/data/storage
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  storage:
    # S3-compatible object storage (RustFS, Apache-2.0). Port 9000: S3 API. Port 9001: web console.
    image: docker.io/rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?run node scripts/gen-env.mjs first}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?run node scripts/gen-env.mjs first}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - kodudb-objects:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  console:
    build: ./console
    environment:
      # The console keeps no secrets: it signs in through the API.
      KODUDB_API_URL: http://api:8787
      KODUDB_PUBLIC_URL: ${KODUDB_PUBLIC_URL:-http://localhost:8787}
    ports:
      - "3100:3000"
    depends_on:
      - api

volumes:
  kodudb-db:
  kodudb-storage:
  kodudb-objects:
